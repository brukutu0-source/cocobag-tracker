<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6b3a">
<title>Coco Bag Trial Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: field-notebook app. Branded header strip, tab bar, one working column (max 920px) of form sections and charts. */
:root{
  --bg:#f5f6f1; --surface:#ffffff; --sunk:#eceee6; --line:#d9dccf; --fg:#1f2a20; --muted:#5d6858;
  --accent:#2f6b3a; --accent-fg:#ffffff; --coco:#99592a; --poly:#3c6d8e;
  --good:#2f7d3e; --warn:#a86a00; --bad:#b23a2e; --good-bg:#e3f1e4; --warn-bg:#fbefd6; --bad-bg:#f8e1de;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131813; --surface:#1b211b; --sunk:#232a23; --line:#343d33; --fg:#e7ece4; --muted:#a3ae9f;
  --accent:#7cc289; --accent-fg:#102013; --coco:#d99a66; --poly:#83b6d8;
  --good:#7cc289; --warn:#e6b45a; --bad:#ee8a7e; --good-bg:#1f3322; --warn-bg:#3a2f17; --bad-bg:#3d2220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131813; --surface:#1b211b; --sunk:#232a23; --line:#343d33; --fg:#e7ece4; --muted:#a3ae9f;
  --accent:#7cc289; --accent-fg:#102013; --coco:#d99a66; --poly:#83b6d8;
  --good:#7cc289; --warn:#e6b45a; --bad:#ee8a7e; --good-bg:#1f3322; --warn-bg:#3a2f17; --bad-bg:#3d2220; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.brand{background:#ffffff;border-bottom:1px solid #d9dccf}
header.brand .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:10px}
header.brand img{height:44px;width:auto;display:block}
header.brand img.coco{height:56px}
.titlebar .wrap{padding-block:14px 6px;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-family:var(--display);font-weight:700;font-size:1.9rem;margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:1.35rem;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:1.1rem;margin:0}
.sub{color:var(--muted);font-size:.9rem}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.82rem;font-weight:600;background:var(--sunk);color:var(--muted)}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{font:600 1rem var(--display);letter-spacing:.04em;text-transform:uppercase;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:12px 12px 9px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
main .wrap{padding-block:16px 64px;display:flex;flex-direction:column;gap:16px}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=datetime-local],textarea,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:500 .92rem var(--body);border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:7px;padding:8px 11px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.q{display:flex;flex-direction:column;gap:6px}
.q > span{font-size:.88rem;font-weight:600;color:var(--muted)}
.btn{font:600 1rem var(--body);border-radius:8px;padding:11px 18px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);min-height:44px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{border-color:var(--bad);background:transparent;color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.kinds{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.kinds button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;color:var(--fg);font:inherit;display:flex;flex-direction:column;gap:2px}
.kinds button strong{font-family:var(--display);font-size:1.15rem;font-weight:600}
.kinds button span{color:var(--muted);font-size:.85rem}
.kinds button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.blk{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.blk .hd{display:flex;justify-content:space-between;align-items:center}
.cnt{display:grid;grid-template-columns:62px repeat(4,1fr);gap:6px;align-items:center;font-size:.8rem;color:var(--muted)}
.cnt input{padding:7px 4px;text-align:center;font-variant-numeric:tabular-nums}
.cnt .t{font-weight:700;font-size:.85rem}
.t.c{color:var(--coco)} .t.p{color:var(--poly)}
.bagnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.bagnav button{font:600 .9rem var(--display);border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:7px;padding:7px 10px;cursor:pointer;white-space:nowrap}
.bagnav button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bagnav button.done::after{content:" \2713";color:var(--good)}
.bag{border:1px solid var(--line);border-left:4px solid var(--coco);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.bag.P{border-left-color:var(--poly)}
.bag .id{font:700 1.15rem var(--display);letter-spacing:.03em;font-variant-numeric:tabular-nums}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.issues{margin:0;padding-left:18px;color:var(--bad);font-size:.92rem}
.note{font-size:.9rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.tile .lbl{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tile .vals{display:flex;gap:16px;margin-top:6px;font-variant-numeric:tabular-nums}
.tile .v{font:700 1.7rem var(--display)} .tile .v small{font:500 .8rem var(--body);display:block;color:var(--muted)}
.v.c{color:var(--coco)} .v.p{color:var(--poly)}
.legend{display:flex;gap:16px;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:320px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
td.num,th.num{text-align:right}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:0}}}
@media (max-width:480px){header.brand img{height:34px} header.brand img.coco{height:44px} h1{font-size:1.55rem}.cnt{grid-template-columns:52px repeat(4,1fr)}}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
</style>
</head>

<script>
(function(){
"use strict";
var BLOCKS=10;
var SAMPLE_IDS=[];
for(var i=0;i<100;i++){var b=Math.floor(i/10)+1,w=i%10,t=w<5?"C":"P",n=(w%5)*10+5;SAMPLE_IDS.push(t+"-"+(b<10?"0":"")+b+"-0"+(n<10?"0":"")+n);}
var VISITS=["V0","V1","V2","V3","Final","Other"];
var FB_QS=[
 ["filling","Filling: was filling Coco Bags easier, the same or harder?",true],
 ["arranging","Arranging: do Coco Bags stand upright and stay in rows?",false],
 ["watering","Watering: do Coco Bags dry faster or slower? Does water run out differently?",true],
 ["handling","Handling: have Coco Bags torn, sagged or lost soil when touched or moved?",true],
 ["labour","Labour: do Coco Bags take more, the same or less work each day?",true],
 ["seedlings","Seedlings: do seedlings look different between the two kinds of bag?",false],
 ["planting","Planting out: would you plant a seedling in its Coco Bag? What would worry you?",false],
 ["overall","Overall: if they cost the same, which would you choose? What would you change?",false]];
var BAGSCORE=["0 Intact","1 Slight softening","2 Sagging, no holes","3 Holes or splits","4 Torn / base failed"];

function lsGet(k,d){try{var v=localStorage.getItem("cbt_"+k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem("cbt_"+k,JSON.stringify(v));}catch(e){}}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function uid(){return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

function blankVisit(wc){var s=[];for(var i=0;i<BLOCKS;i++)s.push({c:["","","",""],p:["","","",""],deaths:""});
  return {kind:"visit",visit:wc?"WC":"",date:today(),collector:lsGet("name",""),weather:"",rain24:"",lastWatered:"",shadeOk:"",notes:"",survival:s,growth:"",sample:{}};}
function blankLift(){return {kind:"lift",date:today(),collector:lsGet("name",""),bags:[]};}
function blankFb(){return {kind:"feedback",date:today(),visit:"",interviewer:lsGet("name",""),worker:"",role:"",consent:"",answers:{}};}
function blankFor(k){return k==="wc"?blankVisit(true):k==="visit"?blankVisit(false):k==="lift"?blankLift():blankFb();}

var S={tab:lsGet("tab","record"),kind:lsGet("kind","visit"),drafts:lsGet("drafts",{}),block:1,recs:lsGet("records",[]),storageOk:true,issues:null,confirmDel:null,dl:null,shareText:false,importMsg:""};
function draft(){if(!S.drafts[S.kind])S.drafts[S.kind]=blankFor(S.kind);return S.drafts[S.kind];}
var saveT;function saveDrafts(){clearTimeout(saveT);saveT=setTimeout(function(){lsSet("drafts",S.drafts);},300);}

function getPath(o,p){var ks=p.split(".");for(var i=0;i<ks.length;i++){if(o==null)return undefined;o=o[ks[i]];}return o;}
function setPath(o,p,v){var ks=p.split(".");for(var i=0;i<ks.length-1;i++){if(o[ks[i]]==null||typeof o[ks[i]]!=="object")o[ks[i]]={};o=o[ks[i]];}o[ks[ks.length-1]]=v;}

function toast(m){var t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true;},2600);}

/* ---------- small builders ---------- */
function seg(path,opts,label){var cur=getPath(draft(),path);var h='<div class="q">'+(label?'<span>'+esc(label)+'</span>':'')+'<div class="seg">';

function inp(path,label,type,extra){var v=getPath(draft(),path);return '<label class="f">'+esc(label)+'<input id="i_'+path.replace(/\./g,"_")+'" type="'+(type||"text")+'" data-k="'+path+'" value="'+esc(v)+'" '+(extra||"")+'></label>';}

function sumOf(a){var t=0,any=false;a.forEach(function(x){if(x!==""&&x!=null){t+=Number(x)||0;any=true;}});return any?t:null;}
function sumPills(s){var c=sumOf(s.c),p=sumOf(s.p);function one(v,l){return '<span class="pill '+(v===null?"":v===50?"good":"bad")+'">'+l+' '+(v===null?"–":v)+'/50</span> ';}return one(c,"C")+one(p,"P");}

function bagDone(b,growth){if(!b||!b.st)return false;if(b.st==="missing")return true;if(b.bs===undefined||b.bs==="")return false;
  if(b.st==="alive"&&growth==="yes"&&(b.h===""||b.h==null||b.d===""||b.d==null||b.l===""||b.l==null))return false;return true;}
function sampleSection(d){var h='<section class="card"><h2>Growth sample (ribbon bags)</h2>'+
  seg("growth",YN,"Measuring height, stem and leaves on this visit? (Yes from V1, week 3)")+

  for(var b=1;b<=BLOCKS;b++){var ids=SAMPLE_IDS.slice((b-1)*10,b*10),done=ids.every(function(id){return bagDone(d.sample[id],d.growth);});
    h+='<button type="button" data-block="'+b+'" aria-pressed="'+(S.block===b)+'" class="'+(done?"done":"")+'">B'+String(b).padStart(2,"0")+'</button>';}
  h+='</div>';

  h+='<div class="row">'+(S.block>1?'<button class="btn ghost" type="button" data-block="'+(S.block-1)+'">Previous block</button>':'')+(S.block<BLOCKS?'<button class="btn ghost" type="button" data-block="'+(S.block+1)+'">Next block</button>':'')+'</div></section>';
  return h;}
function bagCard(id,d){var p="sample."+id+".",b=d.sample[id]||{},h='<div class="bag '+id[0]+'"><div class="row" style="justify-content:space-between"><span class="id">'+id+'</span><span class="pill">'+(id[0]==="C"?"Coco Bag":"Polyethylene")+(id.slice(-3)==="005"?" · photo bag":"")+'</span></div>';
  h+=seg(p+"st",[["alive","Alive"],["not_emerged","Not up"],["dead","Dead"],["missing","Missing"]],"Seedling");
  if(b.st==="dead")h+=seg(p+"cause",[["drought","Drought"],["waterlogging","Waterlogging"],["pests","Pests"],["damping_off","Damping off"],["physical","Physical damage"],["unknown","Unknown"]],"Likely cause");
  if(b.st==="alive"&&d.growth==="yes")h+='<div class="nums">'+inp(p+"h","Height cm","number",'inputmode="decimal" step="0.1" min="0" max="80"')+inp(p+"d","Stem mm","number",'inputmode="decimal" step="0.1" min="0" max="20"')+inp(p+"l","Leaves","number",'inputmode="numeric" min="0" max="40"')+'</div>';
  if(b.st==="alive")h+=seg(p+"ps",[["1","1 Healthy"],["2","2 Some yellowing"],["3","3 Wilting / severe"]],"Plant condition");
  if(b.st&&b.st!=="missing"){h+=seg(p+"bs",BAGSCORE.map(function(l,i){return [String(i),l];}),"Bag condition score")+
    '<div class="grid2">'+seg(p+"rw",YN,"Roots through wall?")+seg(p+"rb",YN,"Roots through base?")+seg(p+"mo",YN,"Mould or algae outside?")+seg(p+"sl",YN,"Soil washed out / sunk >2 cm?")+seg(p+"sw",YN,"Water standing on soil?")+seg(p+"moist",[["dry","Dry"],["moist","Moist"],["wet","Wet"]],"Finger test 2 cm")+'</div>'+
    seg(p+"ph",YN,"Photo taken?");}
  h+=inp(p+"n","Notes");return h+'</div>';}

function liftForm(){var d=draft(),h='<section class="card"><h2>Lift and root-ball test</h2><div class="grid2">'+inp("date","Test date","date")+inp("collector","Data collector name")+'</div>'+

/* ---------- validation & submit ---------- */
function validate(d){var x=[];
  if(!d.date)x.push("Add the date.");
  if(d.kind==="visit"){if(!d.collector)x.push("Add the name of who collected the data.");if(d.visit!=="WC"&&!d.visit)x.push("Choose which visit this is.");
    d.survival.forEach(function(s,i){var c=sumOf(s.c),p=sumOf(s.p);if(c!==50)x.push("Block B"+String(i+1).padStart(2,"0")+": Coco counts add up to "+(c===null?0:c)+", not 50.");if(p!==50)x.push("Block B"+String(i+1).padStart(2,"0")+": polyethylene counts add up to "+(p===null?0:p)+", not 50.");});
    if(d.visit!=="WC"){if(!d.growth)x.push("Say whether you are measuring growth on this visit.");
      var miss=SAMPLE_IDS.filter(function(id){return !bagDone(d.sample[id],d.growth);});if(miss.length)x.push(miss.length+" growth-sample bags are incomplete (first: "+miss.slice(0,4).join(", ")+").");
      SAMPLE_IDS.forEach(function(id){var b=d.sample[id];if(b&&b.st==="alive"&&d.growth==="yes"){if(b.h!==""&&b.h!=null&&(b.h<=0||b.h>80))x.push(id+": height "+b.h+" cm looks wrong.");if(b.d!==""&&b.d!=null&&(b.d<=0||b.d>20))x.push(id+": stem "+b.d+" mm looks wrong.");}});}}
  if(d.kind==="lift"){if(!d.bags.length)x.push("Add at least one bag.");d.bags.forEach(function(b,i){if(!/^[CP]-(0[1-9]|10)-0[0-5][0-9]$/.test(b.id||""))x.push("Bag "+(i+1)+": label should look like C-03-027.");if(!b.rootball)x.push("Bag "+(i+1)+": choose the root-ball result.");});}
  if(d.kind==="feedback"){if(!d.worker)x.push("Add the worker code.");if(!d.consent)x.push("Record whether consent was given.");}
  return x;}
function submit(){var d=draft(),iss=validate(d);
  if(iss.length&&!(S.issues&&S.issues.length)){S.issues=iss;render();var el=document.getElementById("submitBtn");if(el)el.scrollIntoView({block:"center"});return;}
  var rec=JSON.parse(JSON.stringify(d));rec.uid=uid();rec.submittedAt=new Date().toISOString();rec.gaps=iss;rec.app=2;
  if(rec.collector)lsSet("name",rec.collector);if(rec.interviewer)lsSet("name",rec.interviewer);
  S.recs.push(rec);saveRecs();S.drafts[S.kind]=blankFor(S.kind);lsSet("drafts",S.drafts);S.issues=null;S.block=1;
  toast("Record saved on this phone");render();window.scrollTo(0,0);}

/* ---------- storage on this device ---------- */
function saveRecs(){try{localStorage.setItem("cbt_records",JSON.stringify(S.recs));}catch(e){toast("Could not save: phone storage is full or blocked. Send your data now.");}pill();}
function unsent(){return S.recs.filter(function(r){return !r._sent;});}
function pill(){var el=document.getElementById("syncPill"),n=unsent().length;
  if(!S.storageOk){el.className="pill bad";el.textContent="Storage blocked: data will not be kept";return;}
  if(n===0){el.className="pill good";el.textContent=S.recs.length?"All records sent":"No records yet";}
  else{el.className="pill warn";el.textContent=n+" not yet sent";}}
function saveFile(name,text,mime,preferShare){var blob=new Blob([text],{type:mime});
  function dl(){var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},2000);return true;}
  var file=null;try{file=new File([blob],name,{type:mime});}catch(e){}
  if(preferShare&&file&&navigator.canShare&&navigator.canShare({files:[file]})){
    return navigator.share({files:[file],title:name,text:"Coco Bag trial data"}).then(function(){return true;},function(e){return e&&e.name==="AbortError"?false:dl();});}
  return Promise.resolve(dl());}
function packFile(list){return JSON.stringify({format:"cocobag-trial",version:2,exportedAt:new Date().toISOString(),from:lsGet("name",""),
  records:list.map(function(r){var c=Object.assign({},r);delete c._sent;delete c._received;return c;})});}

/* ---------- data helpers ---------- */
function allRecs(){return S.recs.slice().sort(function(a,b){return (a.date+a.submittedAt)<(b.date+b.submittedAt)?-1:1;});}
function visitLabel(r){return r.visit==="WC"?"Weekly check":r.visit||"Visit";}
function totals(r){var t={c:[0,0,0,0],p:[0,0,0,0]};(r.survival||[]).forEach(function(s){for(var j=0;j<4;j++){t.c[j]+=Number(s.c[j])||0;t.p[j]+=Number(s.p[j])||0;}});return t;}
function mean(a){a=a.filter(function(x){return x!==""&&x!=null&&!isNaN(Number(x));}).map(Number);return a.length?a.reduce(function(s,x){return s+x;},0)/a.length:null;}
function sampleBy(r,type){return SAMPLE_IDS.filter(function(id){return id[0]===type;}).map(function(id){return (r.sample||{})[id];}).filter(Boolean);}
function fmtDate(s){if(!s)return "";var p=s.split("-");var m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][Number(p[1])-1];return Number(p[2])+" "+m;}

/* ---------- charts ---------- */
function lineChart(points,opt){/* points: [{x:label,c:val,p:val}] */
  var W=640,H=260,L=48,R=16,T=16,B=40,n=points.length;if(!n)return "";
  var vals=[];points.forEach(function(p){if(p.c!=null)vals.push(p.c);if(p.p!=null)vals.push(p.p);});
  var lo=opt.min!=null?opt.min:0,hi=opt.max!=null?opt.max:Math.max(1,Math.max.apply(null,vals));
  var st=opt.max==null?niceStep(hi/4):(hi-lo)/4;if(opt.max==null)hi=Math.ceil(hi/st)*st;
  var ticks=[];for(var tv=lo;tv<=hi+1e-9;tv+=st)ticks.push(tv);
  function X(i){return n===1?L+(W-L-R)/2:L+i*(W-L-R)/(n-1);}function Y(v){return T+(H-T-B)*(1-(v-lo)/(hi-lo));}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.title)+'">';
  ticks.forEach(function(t){s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(t)+'" y2="'+Y(t)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-8)+'" y="'+(Y(t)+4)+'" text-anchor="end" font-size="12" fill="var(--muted)">'+fmtN(t)+(opt.unit||"")+'</text>';});
  points.forEach(function(p,i){if(n<=8||i%Math.ceil(n/8)===0)s+='<text x="'+X(i)+'" y="'+(H-B+20)+'" text-anchor="middle" font-size="12" fill="var(--muted)">'+esc(p.x)+'</text>';});
  [["c","var(--coco)"],["p","var(--poly)"]].forEach(function(k){var d="",last=null;points.forEach(function(p,i){if(p[k[0]]==null)return;d+=(d?"L":"M")+X(i).toFixed(1)+" "+Y(p[k[0]]).toFixed(1);last=i;});
    if(d)s+='<path d="'+d+'" fill="none" stroke="'+k[1]+'" stroke-width="2.5" stroke-linejoin="round"/>';
    points.forEach(function(p,i){if(p[k[0]]==null)return;s+='<circle cx="'+X(i)+'" cy="'+Y(p[k[0]])+'" r="'+(i===last?5:3.5)+'" fill="'+k[1]+'"><title>'+esc(p.x)+": "+fmtN(p[k[0]])+(opt.unit||"")+'</title></circle>';});
    if(last!=null)s+='<text x="'+Math.min(X(last)+8,W-R-2)+'" y="'+(Y(points[last][k[0]])+(above(points[last],k[0])?-8:16))+'" font-size="12" font-weight="600" fill="'+k[1]+'" text-anchor="'+(X(last)+60>W?"end":"start")+'">'+fmtN(points[last][k[0]])+(opt.unit||"")+'</text>';});
  return s+'</svg>';}
function above(pt,k){var o=k==="c"?"p":"c";return pt[o]==null||pt[k]>=pt[o];}
function niceStep(x){var p=Math.pow(10,Math.floor(Math.log10(x||1))),f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p;}
function fmtN(v){return Math.abs(v-Math.round(v))<0.05?String(Math.round(v)):v.toFixed(1);}
function stackBars(rows,cats,colors,title){/* rows: [{label, counts[]}] */
  var W=640,rowH=34,L=110,R=16,T=8,H=T+rows.length*(rowH+10)+28;var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(title)+'">';
  rows.forEach(function(r,i){var tot=r.counts.reduce(function(a,b){return a+b;},0)||1,x=L,y=T+i*(rowH+10);
    s+='<text x="'+(L-10)+'" y="'+(y+rowH/2+5)+'" text-anchor="end" font-size="13" font-weight="600" fill="var(--fg)">'+esc(r.label)+'</text>';
    r.counts.forEach(function(c,j){var w=(W-L-R)*c/tot;if(w<=0)return;s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+rowH+'" fill="'+colors[j]+'"><title>'+esc(cats[j])+': '+c+'</title></rect>';
      if(w>26)s+='<text x="'+(x+w/2)+'" y="'+(y+rowH/2+5)+'" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">'+c+'</text>';x+=w;});});
  var lx=L;cats.forEach(function(c,j){s+='<rect x="'+lx+'" y="'+(H-18)+'" width="10" height="10" fill="'+colors[j]+'"/><text x="'+(lx+14)+'" y="'+(H-9)+'" font-size="11" fill="var(--muted)">'+esc(c)+'</text>';lx+=Math.max(70,c.length*6.5+26);});
  return s+'</svg>';}
var SCORE_COL=["#3f8a4c","#8fb35a","#d7b13e","#d9792f","#b23a2e"];

/* ---------- dashboard ---------- */
function renderDash(){var recs=allRecs(),h='';
  var visits=recs.filter(function(r){return r.kind==="visit";});
  if(!visits.length)return h+'<div class="empty"><h2>No trial data yet</h2><p>Survival, growth and bag-condition charts appear here once the first visit or weekly check is submitted on the Record data tab.</p></div>';
  var surv=visits.map(function(r){var t=totals(r);return {x:fmtDate(r.date)+(r.visit&&r.visit!=="WC"?" "+r.visit:""),c:t.c[0]/5,p:t.p[0]/5,r:r,t:t};});
  var last=surv[surv.length-1];
  var gv=visits.filter(function(r){return r.visit!=="WC"&&r.growth==="yes";});
  var growth=gv.map(function(r){function m(t,f){return mean(sampleBy(r,t).filter(function(b){return b.st==="alive";}).map(function(b){return b[f];}));}
    return {x:fmtDate(r.date)+" "+(r.visit||""),c:m("C","h"),p:m("P","h"),dc:m("C","d"),dp:m("P","d"),lc:m("C","l"),lp:m("P","l")};});
  var cv=visits.filter(function(r){return r.visit!=="WC"&&r.sample&&Object.keys(r.sample).length;});var lastC=cv[cv.length-1];
  function cnt(r,t,f,v){return sampleBy(r,t).filter(function(b){return b[f]===v;}).length;}
  h+='<div class="tiles">'+
   tile("Seedlings alive · "+last.x,pct(last.c),pct(last.p),"of 500")+
   (growth.length?tile("Mean height · "+growth[growth.length-1].x,fmtU(growth[growth.length-1].c," cm"),fmtU(growth[growth.length-1].p," cm"),"live sample bags"):tile("Mean height","–","–","from V1"))+
   (lastC?tile("Bags scoring 3–4 · "+fmtDate(lastC.date),cnt(lastC,"C","bs","3")+cnt(lastC,"C","bs","4"),cnt(lastC,"P","bs","3")+cnt(lastC,"P","bs","4"),"of 50 sample bags"):"")+
   (lastC?tile("Roots through wall · "+fmtDate(lastC.date),cnt(lastC,"C","rw","yes"),cnt(lastC,"P","rw","yes"),"of 50 sample bags"):"")+'</div>';
  var lg='<div class="legend"><span><i style="background:var(--coco)"></i>Coco Bag</span><span><i style="background:var(--poly)"></i>Polyethylene</span></div>';
  h+='<section class="card"><h2>Seedlings alive, % of 500</h2>'+lg+'<div class="chart">'+lineChart(surv,{min:0,max:100,unit:"%",title:"Seedlings alive by bag type"})+'</div><p class="note">Includes collector visits and workers’ weekly checks. Before emergence, low values are expected.</p></section>';
  if(growth.length)h+='<section class="card"><h2>Mean seedling height, cm</h2>'+lg+'<div class="chart">'+lineChart(growth,{title:"Mean height by bag type",unit:""})+'</div>'+
    '<div class="tbl"><table><thead><tr><th>Visit</th><th class="num">Height C</th><th class="num">Height P</th><th class="num">Stem C (mm)</th><th class="num">Stem P (mm)</th><th class="num">Leaves C</th><th class="num">Leaves P</th></tr></thead><tbody>'+
    growth.map(function(g){return '<tr><td>'+esc(g.x)+'</td><td class="num">'+f1(g.c)+'</td><td class="num">'+f1(g.p)+'</td><td class="num">'+f1(g.dc)+'</td><td class="num">'+f1(g.dp)+'</td><td class="num">'+f1(g.lc)+'</td><td class="num">'+f1(g.lp)+'</td></tr>';}).join("")+'</tbody></table></div></section>';
  if(lastC){var rows=["C","P"].map(function(t){return {label:t==="C"?"Coco Bag":"Polyethylene",counts:[0,1,2,3,4].map(function(sc){return cnt(lastC,t,"bs",String(sc));})};});
    h+='<section class="card"><h2>Bag condition · '+fmtDate(lastC.date)+' '+esc(lastC.visit||"")+'</h2><p class="note">Growth-sample bags by condition score, 0 = intact to 4 = torn or base failed.</p><div class="chart">'+stackBars(rows,["0 Intact","1 Slight","2 Sagging","3 Holes","4 Failed"],SCORE_COL,"Bag condition by type")+'</div>'+
    '<div class="tbl"><table><thead><tr><th>Sample bags (of 50)</th><th class="num">Coco</th><th class="num">Poly</th></tr></thead><tbody>'+
    [["Roots through wall","rw","yes"],["Roots through base","rb","yes"],["Mould or algae","mo","yes"],["Soil washed out / sunk","sl","yes"],["Standing water","sw","yes"],["Soil dry (finger test)","moist","dry"],["Soil wet (finger test)","moist","wet"]].map(function(q){return '<tr><td>'+q[0]+'</td><td class="num">'+cnt(lastC,"C",q[1],q[2])+'</td><td class="num">'+cnt(lastC,"P",q[1],q[2])+'</td></tr>';}).join("")+'</tbody></table></div></section>';}
  h+='<section class="card"><h2>Survival counts by date</h2><div class="tbl"><table><thead><tr><th>Date</th><th>Record</th><th class="num">C alive</th><th class="num">C not up</th><th class="num">C dead</th><th class="num">C missing</th><th class="num">P alive</th><th class="num">P not up</th><th class="num">P dead</th><th class="num">P missing</th></tr></thead><tbody>'+
    surv.slice().reverse().map(function(s){return '<tr><td>'+esc(s.r.date)+'</td><td>'+esc(visitLabel(s.r))+(!s.r._sent?' <span class="pill warn">not sent</span>':'')+'</td>'+s.t.c.concat(s.t.p).map(function(v){return '<td class="num">'+v+'</td>';}).join("")+'</tr>';}).join("")+'</tbody></table></div></section>';
  var lifts=recs.filter(function(r){return r.kind==="lift";});
  if(lifts.length){var lb=[];lifts.forEach(function(r){(r.bags||[]).forEach(function(b){lb.push(b);});});
    var lrows=["C","P"].map(function(t){var bs=lb.filter(function(b){return (b.id||"")[0]===t;});return {label:t==="C"?"Coco Bag":"Polyethylene",counts:["intact","partly","collapsed"].map(function(v){return bs.filter(function(b){return b.rootball===v;}).length;}),tear:bs.filter(function(b){return b.tear==="yes";}).length,n:bs.length};});
    h+='<section class="card"><h2>Lift test: root ball</h2><div class="chart">'+stackBars(lrows,["Intact","Partly broken","Collapsed"],["#3f8a4c","#d7b13e","#b23a2e"],"Lift test results")+'</div><p class="note">Tore when lifted: Coco '+lrows[0].tear+' of '+lrows[0].n+', polyethylene '+lrows[1].tear+' of '+lrows[1].n+'.</p></section>';}
  var fbs=recs.filter(function(r){return r.kind==="feedback"&&r.consent==="yes";});
  if(fbs.length){h+='<section class="card"><h2>Worker feedback: Coco compared with polyethylene</h2><div class="tbl"><table><thead><tr><th>Question</th><th class="num">Coco easier / better</th><th class="num">Same</th><th class="num">Coco harder / worse</th></tr></thead><tbody>'+
    FB_QS.filter(function(q){return q[2];}).map(function(q){function c(v){return fbs.filter(function(r){return getPath(r,"answers."+q[0]+".score")===v;}).length;}return '<tr><td>'+esc(q[1].split(":")[0])+'</td><td class="num">'+c("easier")+'</td><td class="num">'+c("same")+'</td><td class="num">'+c("harder")+'</td></tr>';}).join("")+'</tbody></table></div><p class="note">'+fbs.length+' interviews with consent. Full answers are in the export.</p></section>';}
  return h;}
function tile(l,c,p,s){return '<div class="tile"><div class="lbl">'+esc(l)+'</div><div class="vals"><div class="v c">'+c+'<small>Coco</small></div><div class="v p">'+p+'<small>Poly</small></div></div><div class="note">'+esc(s)+'</div></div>';}
function pct(v){return v==null?"–":Math.round(v)+"%";}function fmtU(v,u){return v==null?"–":v.toFixed(1)+u;}function f1(v){return v==null?"–":v.toFixed(1);}

/* ---------- records & export ---------- */
function renderRecords(){var recs=allRecs().slice().reverse(),n=unsent().length,h='';
  h+='<section class="card"><h2>Send data to Ebenezer</h2>'+
    (n?'<p><strong>'+n+' record'+(n>1?"s":"")+' not yet sent.</strong> Send them after every visit, by WhatsApp or email, as a data file.</p>':'<p>All records on this phone have been sent.</p>')+
    '<div class="row"><button class="btn" type="button" id="sendNew"'+(n?'':' disabled')+'>Send new records</button><button class="btn ghost" type="button" id="sendAll"'+(S.recs.length?'':' disabled')+'>Send everything (backup)</button></div>'+
    '<p class="note">On a phone this opens the share menu: choose WhatsApp or email. On a computer the file is saved to Downloads. Records stay on this phone after sending.</p></section>';
  h+='<section class="card"><h2>Add records from data files</h2><p class="note">Open the .json files the data collector sends. Records already here are not added twice.</p>'+
    '<label class="btn ghost" for="importFile" style="align-self:flex-start">Choose data files</label><input id="importFile" type="file" accept=".json,application/json" multiple hidden>'+
    (S.importMsg?'<p class="note"><strong>'+esc(S.importMsg)+'</strong></p>':'')+'</section>';
  h+='<section class="card"><h2>Export to Excel</h2><p class="note">Each file opens in Excel or Google Sheets. One row per block, bag or interview.</p><div class="row">'+
    [["survival","Survival counts"],["sample","Growth sample"],["lift","Lift test"],["feedback","Worker feedback"]].map(function(x){return '<button class="btn ghost" type="button" data-export="'+x[0]+'">'+x[1]+' (.csv)</button>';}).join("")+'</div></section>';
  h+='<section class="card"><h2>All records on this device</h2>';
  if(!recs.length)h+='<div class="empty">No records yet. Submitted visits, weekly checks, lift tests and interviews, and records added from data files, are listed here.</div>';
  else h+='<div class="tbl"><table><thead><tr><th>Date</th><th>Type</th><th>By</th><th>Status</th><th></th></tr></thead><tbody>'+recs.map(function(r){
    var type=r.kind==="visit"?visitLabel(r):r.kind==="lift"?"Lift test ("+(r.bags||[]).length+" bags)":"Interview "+(r.worker||"");
    var del=S.confirmDel===r.uid?'<button class="btn danger" type="button" data-del="'+r.uid+'">Confirm delete</button>':'<button class="btn ghost" type="button" data-askdel="'+r.uid+'">Delete</button>';
    return '<tr><td>'+esc(r.date)+'</td><td>'+esc(type)+'</td><td>'+esc(r.collector||r.interviewer||"")+'</td><td>'+(r._received?'<span class="pill">Received</span>':r._sent?'<span class="pill good">Sent</span>':'<span class="pill warn">Not sent</span>')+(r.gaps&&r.gaps.length?' <span class="pill">'+r.gaps.length+' gaps noted</span>':'')+'</td><td>'+del+'</td></tr>';}).join("")+'</tbody></table></div>';
  h+='<p class="note">Records are kept in this browser on this device. Clearing the browser’s data or uninstalling the browser deletes them, so send them after every visit.</p>';
  return h+'</section>';}
function csv(rows){return rows.map(function(r){return r.map(function(v){v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(",");}).join("\n");}
function buildCsv(kind){var recs=allRecs(),rows=[];
  if(kind==="survival"){rows.push(["date","record","collector","block","bag_type","alive","not_emerged","dead","missing","deaths_or_problems","notes"]);
    recs.filter(function(r){return r.kind==="visit";}).forEach(function(r){(r.survival||[]).forEach(function(s,i){["c","p"].forEach(function(t){rows.push([r.date,visitLabel(r),r.collector,"B"+String(i+1).padStart(2,"0"),t==="c"?"Coco":"Polyethylene"].concat(s[t]).concat([t==="c"?s.deaths:"",i===0&&t==="c"?r.notes:""]));});});});}
  if(kind==="sample"){rows.push(["date","visit","bag_id","bag_type","block","status","death_cause","height_cm","stem_mm","leaves","plant_score","bag_score","roots_wall","roots_base","mould","soil_loss","standing_water","moisture","photo","notes"]);
    recs.filter(function(r){return r.kind==="visit"&&r.visit!=="WC";}).forEach(function(r){SAMPLE_IDS.forEach(function(id){var b=(r.sample||{})[id]||{};rows.push([r.date,r.visit,id,id[0]==="C"?"Coco":"Polyethylene",id.slice(2,4),b.st,b.cause,b.h,b.d,b.l,b.ps,b.bs,b.rw,b.rb,b.mo,b.sl,b.sw,b.moist,b.ph,b.n]);});});}
  if(kind==="lift"){rows.push(["date","collector","bag_id","bag_type","score_before","tore","soil_fell_out","seconds","score_after","root_ball","opened","roots_into_wall","photo","notes"]);
    recs.filter(function(r){return r.kind==="lift";}).forEach(function(r){(r.bags||[]).forEach(function(b){rows.push([r.date,r.collector,b.id,(b.id||"")[0]==="C"?"Coco":(b.id||"")[0]==="P"?"Polyethylene":"",b.before,b.tear,b.soil,b.sec,b.after,b.rootball,b.opened,b.rootsWall,b.ph,b.notes]);});});}
  if(kind==="feedback"){var hd=["date","visit","interviewer","worker","role","consent"];FB_QS.forEach(function(q){if(q[2])hd.push(q[0]+"_score");hd.push(q[0]+"_text");});hd.push("other");rows.push(hd);
    recs.filter(function(r){return r.kind==="feedback";}).forEach(function(r){var row=[r.date,r.visit,r.interviewer,r.worker,r.role,r.consent];FB_QS.forEach(function(q){if(q[2])row.push(getPath(r,"answers."+q[0]+".score"));row.push(getPath(r,"answers."+q[0]+".text"));});row.push(getPath(r,"answers.other.text"));rows.push(row);});}
  return csv(rows);}
function doExport(kind){var name="cocobag_trial_"+kind+"_"+today()+".csv";saveFile(name,"﻿"+buildCsv(kind),"text/csv",false).then(function(ok){if(ok)toast("Saved "+name);});}
function doSend(all){var list=all?S.recs:unsent();if(!list.length)return;var who=(lsGet("name","")||"collector").replace(/[^A-Za-z0-9]+/g,"-");
  var name="cocobag_data_"+who+"_"+today()+".json";
  saveFile(name,packFile(list),"application/json",true).then(function(ok){if(!ok)return;list.forEach(function(r){r._sent=true;});saveRecs();toast("Data file ready: "+name);render();});}
function doImport(files){var added=0,updated=0,bad=0,left=files.length;if(!left)return;
  Array.prototype.forEach.call(files,function(f){var rd=new FileReader();rd.onload=function(){try{var o=JSON.parse(rd.result);var list=Array.isArray(o)?o:o.records;if(!Array.isArray(list))throw 0;
      list.forEach(function(r){if(!r||!r.uid||!r.kind){bad++;return;}var i=S.recs.findIndex(function(x){return x.uid===r.uid;});var c=Object.assign({},r,{_sent:true,_received:true});
        if(i<0){S.recs.push(c);added++;}else if(S.recs[i]._received){S.recs[i]=c;updated++;}});}catch(e){bad++;}
    finish();};rd.onerror=function(){bad++;finish();};rd.readAsText(f);});
  function finish(){if(--left>0)return;saveRecs();S.importMsg="Added "+added+" record"+(added===1?"":"s")+(updated?", updated "+updated:"")+(bad?". "+bad+" item"+(bad===1?"":"s")+" could not be read: check it is a Coco Bag data file":"")+".";render();}}
/* ---------- help ---------- */
function renderHelp(){return '<section class="card"><h2>How to use this tracker</h2>'+
 '<ol><li><strong>First time:</strong> open the tracker on the phone while you have signal, then use the browser menu → Add to Home screen. After that it opens like an app and works without signal.</li>'+
 '<li><strong>At the nursery:</strong> choose what you are recording on the Record data tab and fill it in. Everything is kept on the phone as you type, so a dropped signal or a closed tab loses nothing.</li>'+
 '<li><strong>Submit:</strong> press Submit record. The form checks that the counts add up to 50 per block and flags missing or unlikely values.</li>'+
 '<li><strong>Send:</strong> after each visit, go to Records &amp; export and press Send new records. Choose WhatsApp or email and send the data file to Ebenezer.</li>'+
 '<li><strong>Ebenezer:</strong> opens the tracker on a laptop, presses Choose data files on Records &amp; export, then views the Dashboard and exports to Excel.</li>'+
 '<li><strong>Photos:</strong> take them with the phone camera following the photo protocol, name them by date and bag label, and send them by WhatsApp. Tick Photo taken in the form.</li>'+
 '<li><strong>Worker weekly checks:</strong> enter each paper sheet with Worker weekly check, using the date the check was done.</li></ol>'+
 '<p class="note">No account or sign-in is needed. Data is stored only in this browser on this device until it is sent as a file. Use the same browser each time.</p>'+
 '<p class="note">Bag labels: C = Coco Bag, P = polyethylene, then block (01–10) and bag number (001–050). The ribbon growth-sample bags are numbers 005, 015, 025, 035 and 045 of each type in every block.</p></section>';}
/* ---------- render & events ---------- */
function render(){var v=document.getElementById("view");
  document.querySelectorAll("nav.tabs button").forEach(function(b){b.setAttribute("aria-selected",String(b.dataset.tab===S.tab));});
  v.innerHTML=S.tab==="record"?renderRecord():S.tab==="dash"?renderDash():S.tab==="records"?renderRecords():renderHelp();pill();}
document.querySelector("nav.tabs").addEventListener("click",function(e){var b=e.target.closest("button[data-tab]");if(!b)return;S.tab=b.dataset.tab;lsSet("tab",S.tab);S.dl=null;render();window.scrollTo(0,0);});
var view=document.getElementById("view");
view.addEventListener("input",function(e){var el=e.target,k=el.dataset&&el.dataset.k;if(!k||el.id==="importArea")return;
  var val=el.value;if(el.type==="number"&&val!=="")val=Number(val);setPath(draft(),k,val);saveDrafts();
  if(el.dataset.sum!=null){var i=Number(el.dataset.sum);document.getElementById("sum_"+i).innerHTML=sumPills(draft().survival[i]);}});
view.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
  if(b.dataset.k){var cur=getPath(draft(),b.dataset.k),v=b.dataset.v;setPath(draft(),b.dataset.k,cur===v?"":v);saveDrafts();render();return;}
  if(b.dataset.kind){S.kind=b.dataset.kind;lsSet("kind",S.kind);S.issues=null;S.block=1;render();return;}
  if(b.dataset.block){S.block=Number(b.dataset.block);render();var nav=document.querySelector(".bagnav");if(nav)nav.scrollIntoView({block:"start"});return;}
  if(b.dataset.rmbag!=null){draft().bags.splice(Number(b.dataset.rmbag),1);saveDrafts();render();return;}
  if(b.id==="addBag"){draft().bags.push({});saveDrafts();render();return;}
  if(b.id==="submitBtn"){submit();return;}
  if(b.id==="clearBtn"){if(S.confirmClear){S.drafts[S.kind]=blankFor(S.kind);lsSet("drafts",S.drafts);S.confirmClear=false;S.issues=null;}else{S.confirmClear=true;setTimeout(function(){S.confirmClear=false;},4000);}render();return;}
  if(b.id==="sendNew"){doSend(false);return;}
  if(b.id==="sendAll"){doSend(true);return;}
  if(b.dataset.export){doExport(b.dataset.export);return;}
  if(b.dataset.askdel){S.confirmDel=b.dataset.askdel;render();return;}
  if(b.dataset.del){var id=b.dataset.del;S.confirmDel=null;S.recs=S.recs.filter(function(r){return r.uid!==id;});saveRecs();toast("Record deleted");render();return;}
});
view.addEventListener("change",function(e){if(e.target.id==="importFile"){doImport(e.target.files);e.target.value="";}});

if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register("sw.js").catch(function(){});}
})();
